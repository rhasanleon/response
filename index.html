<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Math Quiz</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js for the Admin QR generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .correct { background-color: #22c55e !important; color: white !important; }
        .wrong { background-color: #ef4444 !important; color: white !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-center space-x-4">
        <button onclick="showView('student')" class="hover:underline font-bold">Take Quiz</button>
        <button onclick="showView('admin')" class="hover:underline font-bold">Admin Panel</button>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">

        <!-- ===================== STUDENT VIEW ===================== -->
        <div id="student-view" class="w-full max-w-2xl bg-white p-6 rounded-lg shadow-lg fade-in">
            
            <!-- Start Screen -->
            <div id="start-screen" class="text-center">
                <h1 class="text-3xl font-bold mb-4 text-blue-600">Daily Quiz</h1>
                <p class="mb-6 text-gray-600">Test your knowledge! You have a set time limit per question.</p>
                <button onclick="startQuiz()" class="bg-blue-600 text-white px-8 py-3 rounded-full text-lg font-bold hover:bg-blue-700 transition">Start Quiz</button>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <span id="question-progress" class="text-sm font-semibold text-gray-500">Question 1 of 4</span>
                    <span id="timer-display" class="text-xl font-bold text-red-600 bg-red-100 px-3 py-1 rounded">Time: 60s</span>
                </div>
                
                <h2 id="question-text" class="text-xl font-semibold mb-6"></h2>
                
                <div id="options-container" class="space-y-3 mb-6">
                    <!-- Options will be injected here -->
                </div>

                <div id="feedback-container" class="hidden p-4 rounded bg-gray-50 border border-gray-200">
                    <h3 id="feedback-title" class="font-bold text-lg mb-2"></h3>
                    <p id="feedback-explanation" class="text-gray-700 text-sm"></p>
                </div>

                <button id="next-btn" onclick="nextQuestion()" class="hidden w-full mt-6 bg-blue-600 text-white px-6 py-3 rounded font-bold hover:bg-blue-700 transition">Next Question</button>
            </div>

            <!-- Results Screen -->
            <div id="result-screen" class="hidden text-center">
                <h2 class="text-3xl font-bold mb-4 text-green-600">Quiz Completed!</h2>
                <p class="text-xl mb-6">Your Score: <span id="final-score" class="font-bold"></span></p>
                <button onclick="resetQuiz()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Try Again</button>
            </div>
        </div>

        <!-- ===================== ADMIN VIEW ===================== -->
        <div id="admin-view" class="w-full max-w-4xl bg-white p-6 rounded-lg shadow-lg hidden fade-in">
            <h2 class="text-2xl font-bold mb-4 text-blue-600">Admin Panel</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Add Question Form -->
                <div class="bg-gray-50 p-4 rounded border">
                    <h3 class="font-bold mb-3 text-lg">Add New Question</h3>
                    <form id="add-question-form" class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium">Question Text</label>
                            <textarea id="q-text" required class="w-full p-2 border rounded" rows="3" placeholder="e.g., Use the quotient rule to find h'(x)..."></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Options (Select the correct one)</label>
                            <div class="space-y-2 mt-1">
                                <div class="flex items-center space-x-2">
                                    <input type="radio" name="correct-option" value="0" required>
                                    <input type="text" id="opt-0" required class="w-full p-2 border rounded" placeholder="Option A">
                                </div>
                                <div class="flex items-center space-x-2">
                                    <input type="radio" name="correct-option" value="1">
                                    <input type="text" id="opt-1" required class="w-full p-2 border rounded" placeholder="Option B">
                                </div>
                                <div class="flex items-center space-x-2">
                                    <input type="radio" name="correct-option" value="2">
                                    <input type="text" id="opt-2" required class="w-full p-2 border rounded" placeholder="Option C">
                                </div>
                                <div class="flex items-center space-x-2">
                                    <input type="radio" name="correct-option" value="3">
                                    <input type="text" id="opt-3" required class="w-full p-2 border rounded" placeholder="Option D">
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Explanation (Shown after timer ends)</label>
                            <textarea id="q-explanation" required class="w-full p-2 border rounded" rows="2"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Time Limit (Seconds)</label>
                            <input type="number" id="q-time" value="60" required class="w-full p-2 border rounded">
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700 transition">Add Question</button>
                    </form>
                </div>

                <!-- QR Code & Current Questions -->
                <div class="space-y-6">
                    <div class="bg-blue-50 p-4 rounded border border-blue-200 text-center">
                        <h3 class="font-bold mb-2 text-blue-800">Student QR Code</h3>
                        <p class="text-sm text-blue-600 mb-3">Scan this to open the quiz on a phone</p>
                        <div id="qrcode" class="flex justify-center mb-3"></div>
                        <button onclick="generateQR()" class="bg-blue-600 text-white px-4 py-1 rounded text-sm hover:bg-blue-700">Generate for current URL</button>
                    </div>

                    <div class="bg-gray-50 p-4 rounded border">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-lg">Current Questions</h3>
                            <button onclick="resetToDefault()" class="text-xs text-red-500 hover:underline">Reset to Default</button>
                        </div>
                        <ul id="admin-question-list" class="space-y-2 max-h-60 overflow-y-auto text-sm">
                            <!-- List of questions will be injected here -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // --- DEFAULT DATA (From your requirements) ---
        const defaultQuestions = [
            {
                question: "Use the quotient rule to evaluate h'(a) for the given function h(x) and a. h(x) = 3x^2 / (x^2 + 9x + 9), a = -3",
                options: ["A) -9", "B) 1", "C) -1", "D) 3"],
                correctIndex: 1, // B) 1
                explanation: "h'(x) = (27x^2 + 54x) / (x^2 + 9x + 9)^2. Plugging in x = -3: Numerator = 81, Denominator = 81. 81/81 = 1.",
                timeLimitSeconds: 60
            },
            {
                question: "Use the quotient rule to find the derivative, h'(x), of the following function. h(x) = -10x / (3x^2 - 7x - 5)",
                options: ["A) (-30x^2 - 50) / (3x^2 - 7x - 5)^2", "B) (30x^2 + 50) / (3x^2 - 7x - 5)", "C) (30x^2 + 50) / (3x^2 - 7x - 5)^2", "D) (-60x + 70) / (3x^2 - 7x - 5)^2"],
                correctIndex: 2, // C
                explanation: "h'(x) = [(-10)(3x^2-7x-5) - (-10x)(6x-7)] / (3x^2-7x-5)^2 = (30x^2 + 50) / (3x^2 - 7x - 5)^2.",
                timeLimitSeconds: 90
            },
            {
                question: "Use the quotient rule to find the derivative, h'(x), of the following function. h(x) = -7x^2 / (-10x^2 + 4x - 3)",
                options: ["A) (-28x^2 + 42x) / (-10x^2 + 4x - 3)^2", "B) (28x^2 - 42x) / (-10x^2 + 4x - 3)^2", "C) (-28x^2 + 42x) / (-10x^2 + 4x - 3)", "D) (-14x) / (-20x + 4)"],
                correctIndex: 0, // A
                explanation: "h'(x) = [(-14x)(-10x^2+4x-3) - (-7x^2)(-20x+4)] / denominator^2 = (-28x^2 + 42x) / (-10x^2 + 4x - 3)^2.",
                timeLimitSeconds: 90
            },
            {
                question: "Use the quotient rule to evaluate h'(a) for the given function h(x) and a. h(x) = -6x^2 / (4x^2 + 6x - 10), a = 2",
                options: ["A) -8/27", "B) 16/3", "C) 8/27", "D) 1/3"],
                correctIndex: 2, // C
                explanation: "h'(x) = (-36x^2 + 120x) / (4x^2 + 6x - 10)^2. Plugging in x = 2: Numerator = 96. Denominator = 324. 96/324 simplifies to 8/27.",
                timeLimitSeconds: 60
            }
        ];

        // --- STATE MANAGEMENT ---
        let questions = JSON.parse(localStorage.getItem('quizQuestions')) || defaultQuestions;
        let currentQIndex = 0;
        let score = 0;
        let timerInterval;
        let timeLeft;
        let isAnswered = false;

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            renderAdminQuestions();
            // Pre-generate QR code for current URL
            generateQR();
        });

        // --- NAVIGATION ---
        function showView(view) {
            document.getElementById('student-view').classList.add('hidden');
            document.getElementById('admin-view').classList.add('hidden');
            
            if (view === 'student') {
                document.getElementById('student-view').classList.remove('hidden');
                resetQuiz();
            } else {
                document.getElementById('admin-view').classList.remove('hidden');
            }
        }

        // --- ADMIN LOGIC ---
        document.getElementById('add-question-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newQuestion = {
                question: document.getElementById('q-text').value,
                options: [
                    document.getElementById('opt-0').value,
                    document.getElementById('opt-1').value,
                    document.getElementById('opt-2').value,
                    document.getElementById('opt-3').value
                ],
                correctIndex: parseInt(document.querySelector('input[name="correct-option"]:checked').value),
                explanation: document.getElementById('q-explanation').value,
                timeLimitSeconds: parseInt(document.getElementById('q-time').value)
            };

            questions.push(newQuestion);
            saveQuestions();
            this.reset();
            renderAdminQuestions();
            alert("Question added successfully!");
        });

        function saveQuestions() {
            localStorage.setItem('quizQuestions', JSON.stringify(questions));
        }

        function renderAdminQuestions() {
            const list = document.getElementById('admin-question-list');
            list.innerHTML = '';
            questions.forEach((q, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-white p-2 border rounded";
                li.innerHTML = `
                    <span class="truncate w-3/4">${index + 1}. ${q.question}</span>
                    <button onclick="deleteQuestion(${index})" class="text-red-500 hover:text-red-700 font-bold">&times;</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteQuestion(index) {
            if (confirm("Are you sure you want to delete this question?")) {
                questions.splice(index, 1);
                saveQuestions();
                renderAdminQuestions();
            }
        }

        function resetToDefault() {
            if (confirm("This will erase all custom questions and restore the original 4. Continue?")) {
                questions = [...defaultQuestions];
                saveQuestions();
                renderAdminQuestions();
            }
        }

        function generateQR() {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // Clear previous
            const currentUrl = window.location.href;
            new QRCode(qrContainer, {
                text: currentUrl,
                width: 128,
                height: 128,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        // --- QUIZ ENGINE ---
        function startQuiz() {
            if (questions.length === 0) {
                alert("No questions available. Please add some in the Admin Panel.");
                return;
            }
            currentQIndex = 0;
            score = 0;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            const q = questions[currentQIndex];
            
            // Update Progress
            document.getElementById('question-progress').innerText = `Question ${currentQIndex + 1} of ${questions.length}`;
            
            // Update Question Text
            document.getElementById('question-text').innerText = q.question;
            
            // Hide feedback and next button
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 border rounded hover:bg-blue-50 transition font-medium";
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            // Start Timer
            startTimer(q.timeLimitSeconds);
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            timeLeft = seconds;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer-display').innerText = `Time: ${timeLeft}s`;
            if (timeLeft <= 10) {
                document.getElementById('timer-display').classList.add('bg-red-200', 'text-red-800');
            } else {
                document.getElementById('timer-display').classList.remove('bg-red-200', 'text-red-800');
            }
        }

        function selectAnswer(selectedIndex, btnElement) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);

            const q = questions[currentQIndex];
            const isCorrect = selectedIndex === q.correctIndex;
            const allButtons = document.getElementById('options-container').children;

            // Disable all buttons
            for (let btn of allButtons) {
                btn.disabled = true;
                btn.classList.remove('hover:bg-blue-50');
            }

            // Highlight selected and correct
            if (isCorrect) {
                score++;
                btnElement.classList.add('correct');
            } else {
                btnElement.classList.add('wrong');
                allButtons[q.correctIndex].classList.add('correct'); // Show the right answer
            }

            showFeedback(isCorrect, q.explanation);
        }

        function handleTimeout() {
            if (isAnswered) return;
            isAnswered = true;
            
            const q = questions[currentQIndex];
            const allButtons = document.getElementById('options-container').children;

            // Disable all buttons and show correct answer
            for (let btn of allButtons) {
                btn.disabled = true;
                btn.classList.remove('hover:bg-blue-50');
            }
            allButtons[q.correctIndex].classList.add('correct');

            showFeedback(false, q.explanation, true);
        }

        function showFeedback(isCorrect, explanation, isTimeout = false) {
            const feedbackContainer = document.getElementById('feedback-container');
            const title = document.getElementById('feedback-title');
            const expText = document.getElementById('feedback-explanation');

            feedbackContainer.classList.remove('hidden');
            
            if (isTimeout) {
                title.innerText = "Time's Up!";
                title.className = "font-bold text-lg mb-2 text-red-600";
            } else if (isCorrect) {
                title.innerText = "Correct!";
                title.className = "font-bold text-lg mb-2 text-green-600";
            } else {
                title.innerText = "Incorrect";
                title.className = "font-bold text-lg mb-2 text-red-600";
            }

            expText.innerText = explanation;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        }

        function resetQuiz() {
            clearInterval(timerInterval);
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }
    </script>
</body>
</html>
